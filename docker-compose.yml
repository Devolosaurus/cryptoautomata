services:
  # CPU-only Ollama service (default)
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: cryptoautomata-ollama:latest
    container_name: cryptoautomata-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
      # WARNING: Set OLLAMA_ORIGINS to a specific origin in production (e.g. http://localhost:3000)
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - cpu
      - default

  # NVIDIA GPU-accelerated Ollama service
  ollama-nvidia:
    build:
      context: .
      dockerfile: Dockerfile
    image: cryptoautomata-ollama:latest
    container_name: cryptoautomata-ollama-nvidia
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
      # WARNING: Set OLLAMA_ORIGINS to a specific origin in production (e.g. http://localhost:3000)
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - nvidia

  # AMD GPU (ROCm) Ollama service
  # Uses the official ollama/ollama:rocm image which includes ROCm-specific binaries
  # not present in the base image used by the Dockerfile.
  ollama-amd:
    image: ollama/ollama:rocm
    container_name: cryptoautomata-ollama-amd
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=4
      # WARNING: Set OLLAMA_ORIGINS to a specific origin in production (e.g. http://localhost:3000)
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - amd

volumes:
  ollama_data:
    driver: local
